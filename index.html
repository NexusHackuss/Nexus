<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digimon Nexus</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#050505"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Digimon Nexus"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--bg:#10131c;--card:#1a1f2e;--tx:#e8ebf5;--mu:#8a92a8;--ac:#6f7788;--bd:#2c3347;--hp:#2f9e44;--r:12px;--r2:8px;--r3:6px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--ac:#5b6475;--bg:#f3f5fa;--card:#fff;--tx:#1a1f2e;--mu:#667;--bd:#d5d9e5}
:root[data-theme="cyber"]{--bg:#050505;--card:#0a0a0a;--tx:#f3dede;--mu:#b56a6a;--ac:#ff1f1f;--bd:#6b1010;--hp:#ff3b3b;--r:0px;--r2:0px;--r3:0px}
[data-theme="cyber"] body{font-family:ui-monospace,Consolas,monospace;background-image:repeating-linear-gradient(0deg,rgba(255,0,0,.035) 0 1px,transparent 1px 3px)}
[data-theme="cyber"] .c{border-color:#8f1414;box-shadow:0 0 10px rgba(255,31,31,.15),inset 0 0 0 1px #000}
[data-theme="cyber"] button{background:transparent;border-color:#8f1414;text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-family:inherit}
[data-theme="cyber"] button:hover:not(:disabled){box-shadow:0 0 8px rgba(255,31,31,.6);border-color:#ff1f1f}
[data-theme="cyber"] button.on,[data-theme="cyber"] button.p{background:#ff1f1f;color:#050505;border-color:#ff1f1f;font-weight:700}
[data-theme="cyber"] .tag{background:transparent;border:1px solid #6b1010;color:#ff6b6b;text-transform:uppercase;font-size:10px}
[data-theme="cyber"] .bar{height:4px;background:#2a0808}
[data-theme="cyber"] input,[data-theme="cyber"] select{border-color:#6b1010;font-family:inherit}
[data-theme="cyber"] b{letter-spacing:.03em}
.logo{display:block;max-width:100%;height:auto;max-height:84px;margin:0 auto}.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}.th{display:flex;gap:4px}.th button{padding:6px 8px}
html,body{background:var(--bg)}body{color:var(--tx);font-family:system-ui,sans-serif;max-width:640px;margin:auto;padding:12px}
h1{font-size:20px;margin:4px 0}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;color:var(--mu);font-size:14px;min-height:52px;overflow:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);box-sizing:border-box}.ntx{width:100%;cursor:pointer;background:var(--card);border:1px solid var(--ac);border-radius:var(--r);padding:6px 10px;color:var(--tx);box-sizing:border-box;line-height:1.3;max-height:48px;overflow:auto}
nav{margin:10px 0}.nv{display:flex;gap:4px;overflow-x:auto;margin-bottom:4px}.nv button{flex:1;white-space:nowrap}.nv.sb button{font-size:13px;padding:6px 8px}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r2);padding:8px 10px;cursor:pointer;font-size:14px}
button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4}
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin:8px 0}
.big{font-size:52px;text-align:center}.bar{height:10px;background:var(--bd);border-radius:var(--r3);overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--ac)}.bar.h i{background:var(--hp)}.bar.d i{background:#1c7ed6}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}.mu{color:var(--mu);font-size:13px}
.tag{font-size:11px;background:var(--bd);border-radius:var(--r3);padding:2px 6px;white-space:nowrap}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:8px}.arena .c{text-align:center;margin:0}.arena .big{font-size:44px}
input,select{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;border:1px solid var(--bd);border-radius:var(--r2);background:var(--card);color:var(--tx)}
.nov{z-index:20}.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}.pop{max-width:420px;width:100%;max-height:85vh;overflow:auto}
.dxg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dxt{width:68px;text-align:center;border:1px solid var(--bd);border-radius:var(--r);padding:6px 2px;cursor:pointer;background:var(--card);font-size:11px;box-sizing:border-box}.dxe{display:block;font-size:34px;line-height:1.2}.dxn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}
.auw{position:relative;display:inline-block;line-height:1;isolation:isolate}.auimg{position:relative;z-index:1;display:inline-block}.aura{position:absolute;left:50%;top:50%;width:170%;height:170%;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;z-index:2;opacity:.9;animation:aup 2.6s ease-in-out infinite}.auhalo{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,225,120,.65),rgba(255,140,40,.3) 45%,transparent 70%);animation:auh 2.6s ease-in-out infinite;pointer-events:none;z-index:0}@keyframes aup{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}@keyframes auh{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.aura.aurad{left:50%;top:-113%;width:auto;height:240%;transform:translateX(-50%);image-rendering:pixelated;animation:none;opacity:1}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lg{font-size:13px;line-height:1.5;height:170px;overflow-y:scroll;box-sizing:border-box}
.nt{height:56px;margin:6px 0;display:flex;align-items:center;padding:0 12px;border-radius:var(--r);font-size:14px;line-height:1.3;box-sizing:border-box;overflow:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;border:1px solid transparent}.nt.on{background:var(--card);border-color:var(--ac)}.nt.off{display:none}
</style></head><body>

 if(!sl){sl=[];inh.forEach(x=>{if(sl.length<3&&!sl.includes(x.n))sl.push(x.n)})}
 sl=sl.filter((n,i)=>ok(n)&&sl.indexOf(n)===i);[...nat].reverse().forEach(x=>{if(sl.length<3&&!sl.includes(x.n))sl.push(x.n)});
 m.sl=sl.slice(0,3);m.inh=inh.filter(x=>m.sl.includes(x.n)).map(x=>x.e&&nel(x.e)!==x.e?Object.assign({},x,{e:nel(x.e)}):x)}
function clampAll(){if(!G)return;G.w=G.w||0;G.l=G.l||0;G.inf=G.inf||0;G.mp=G.mp||0;G.boxx=G.boxx||0;G.infT=G.infT||0;let ch=0;allMons().forEach(x=>{if(!D[x.id])return;if(x.pot==null)x.pot=x.rb||0;x.rb=x.rb||0;x.xp=x.xp||0;x.abi=x.abi||0;x.lv=x.lv||1;x.sg2=x.sg2?1:0;const c=statCap(x);ST.forEach(s=>{if(x[s]>c){x[s]=c;ch=1}});if((x.abi||0)>ABI_MAX){x.abi=ABI_MAX;ch=1}syncSlots(x)});
 if(!G.bal2){G.bal2=1;if(ch)G.log='⚖️ Rebalanceamento aplicado: os status agora têm um limite que cresce a cada Reborn. Seus Digimon foram ajustados. Veja o limite na aba Treino.'}}
function mvs(m){const d=D[m.id],mx=m.mdp||DPm(m),L=(n,p)=>Math.round(p*(1+.08*(((m.ml||{})[n]||1)-1))),nat=natMoves(m),inh=m.inh||[];let sl=Array.isArray(m.sl)&&m.sl.length?m.sl:null;
 if(!sl){sl=[];inh.forEach(x=>{if(sl.length<3)sl.push(x.n)});[...nat].reverse().forEach(x=>{if(sl.length<3&&!sl.includes(x.n))sl.push(x.n)})}
 const o=[{n:'Investida',p:L('Investida',12),b:12,c:0,cp:0,e:d.e,phys:1}];
 sl.slice(0,3).forEach(n=>{const x=nat.find(y=>y.n===n);if(x)o.push({n:x.n,p:L(x.n,x.p),b:x.p,c:Math.round(mx*x.cp),cp:x.cp,e:x.e});else{const h=inh.find(y=>y.n===n);if(h){const cp=h.cp??(h.c/100);o.push({n:h.n,p:L(h.n,h.p),b:h.p,c:Math.round(mx*cp),cp,e:nel(h.e),h:1})}}});
 if((m.lv||1)>=75&&d.sig)o.push({n:d.sig,e:d.se,pct:SIGP*(m.sg2?2:1),c:Math.round(mx*.5),cp:.5,b:0,p:0,sg:1});o.push({n:'Guardar',g:1,p:0,c:0});return o}

function train(s){tick();const m=M(),c=statCap(m);if(m[s]>=c){G.log=`⚠️ ${SN[s]} está no limite (${c}). Faça Reborn para aumentar o potencial.`;return draw()}

 let g;if(G.free>0){G.free--;g=5}else{G.extra--;g=1}if(s===D[m.id].sp)g=Math.ceil(g*1.5);g=Math.min(g,c-m[s]);m[s]+=g;m.tt=(m.tt||0)+1;m.tp=m.tp||{F:0,D:0,V:0,I:0};m.tp[s]=(m.tp[s]||0)+1;gx(m,2);G.log=`+${g} ${SN[s]} e +2 XP`;save();draw()}

 const r=rootOf(m);ST.forEach(s=>m[s]=Math.floor(m[s]/2));m.id=r;m.rb=(m.rb||0)+1;m.pot=(m.pot||0)+(mx?2:1);m.lv=1;m.xp=0;m.tp={F:0,D:0,V:0,I:0};G.seen[r]=1;
 G.log=`🥚 Reborn! Voltou a ${D[r].nm}${a?' · +'+a+' ABI (total '+m.abi+')':(d.st>=6?' · ABI no máximo ('+ABI_MAX+')':'')} · Potencial +${mx?2:1}${mx?' (nível máximo: dobrado!)':''} → limite de status ${statCap(m)}`;save();draw()}
function rebHTML(m,d){return d.st>1?`<div class="c"><b>Reborn (de-digivolver)</b><p class="mu">Volta para ${D[rootOf(m)].nm} no Nv 1, mantendo 50% dos atributos. Cada Reborn aumenta o <b>potencial</b> (limite de status): +1, ou <b>+2 se feito no nível 100</b>. De Mega ou acima rende +25 ABI (máx. ${ABI_MAX}; atual: ${m.abi||0}). Potencial atual: ${m.pot||0} (limite ${statCap(m)} por atributo).</p><button onclick="EV={kind:'reb'};draw()">Reborn</button></div>`:''}

 G.inv.extreme--;m.tp=m.tp||{F:0,D:0,V:0,I:0};ST.forEach(s=>{m[s]=Math.min(c,m[s]+20);m.tp[s]=(m.tp[s]||0)+2});G.log=`💠 Cristal Extremo usado em ${D[m.id].nm}: +20 em todos os atributos (até o limite) e +2 pts de treino em cada.`;save();draw()}
function tsApply(){const g=i=>document.getElementById(i),x=allMons().find(z=>z.u===g('ts_m').value);if(!x){G.log='Escolha um Digimon.';return draw()}const lv=+g('ts_l').value,ab=+g('ts_a').value,pt=g('ts_p')?+g('ts_p').value:0;if(lv>=1){x.lv=Math.min(100,Math.floor(lv));x.xp=0}if(ab){x.abi=Math.min(ABI_MAX,Math.max(0,(x.abi||0)+Math.floor(ab)))}if(pt){x.pot=Math.max(0,(x.pot||0)+Math.floor(pt))}save();G.log=`🧪 ${D[x.id].nm}: Nv ${x.lv||1} · ABI ${x.abi||0} · Potencial ${x.pot||0}`;draw()}
function useSeal(){const m=M();if(!(G.inv.sigseal>0))return;if(m.sg2){G.log='Esse Digimon já usou o Selo da Assinatura.';return draw()}G.inv.sigseal--;m.sg2=1;G.log=`🔰 Selo usado em ${D[m.id].nm}: a assinatura agora causa ${SIGP*2}% do HP!`;save();draw()}

function grantFx(it){const q=it.q||1,f=it.fx;if(f==='pts')G.extra+=q;else if(f==='mp')G.mp+=q;else if(f==='xp')gx(M(),q);else if(f==='boost'){const mm=it.m||2;G.boost={m:mm,left:((G.boost&&G.boost.m===mm&&G.boost.left>0)?G.boost.left:0)+q}}else if(f==='egg')tab='pick';else G.inv[f]=(G.inv[f]||0)+q}
function buy(k){const it=SHOP[k];if(!it)return;if(!INFM()&&G.coins<it.p){G.log='Moedas insuficientes.';return draw()}

function mvHTML(m,d){syncSlots(m);const all=mvs(m),ms=all.filter(x=>!x.g&&!x.sg),eq=ms.filter(x=>x.n!=='Investida'),nat=natMoves(m).filter(x=>!m.sl.includes(x.n)),hs=G.inv.hscroll||0;let o='';

const CL=[];let HUMAN=0,CHK=null,FAILS=0,LASTC=0;const CGE=['🐺','🔥','⚡','🌿','❄️','🛡️'];
function cgShow(h){let e=document.getElementById('cg');if(!e){e=document.createElement('div');e.id='cg';if(document.body)document.body.appendChild(e)}e.innerHTML=h}
function cgHide(){const e=document.getElementById('cg');if(e)e.innerHTML=''}
function challenge(){const t=CGE[Math.floor(R()*CGE.length)],ord=[...CGE].sort(()=>R()-.5);CHK=t;try{localStorage.setItem('dd_chk','1')}catch(e){}
 cgShow(`<div class="ov" style="z-index:99"><div class="c pop" style="text-align:center"><b>🤖 Você é humano?</b><p class="mu">Atividade muito repetitiva detectada. Toque no <b style="font-size:22px">${t}</b> para continuar.</p><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">${ord.map(x=>`<button style="font-size:30px;padding:10px 14px" onclick="cgPick('${x}')">${x}</button>`).join('')}</div></div></div>`)}
function cgPick(x){if(x===CHK){CHK=null;FAILS=0;CL.length=0;HUMAN=Date.now()+15*60000;try{localStorage.removeItem('dd_chk')}catch(e){}cgHide();return}FAILS++;if(FAILS>=3)cgLock(Date.now()+300000);else challenge()}
function cgLock(until){try{localStorage.setItem('dd_lock',String(until))}catch(e){}CHK=null;const tk=()=>{const left=until-Date.now();if(left<=0){FAILS=0;try{localStorage.removeItem('dd_lock');localStorage.removeItem('dd_chk')}catch(e){}cgHide();return}cgShow(`<div class="ov" style="z-index:99"><div class="c pop" style="text-align:center"><b>⏳ Pausa de segurança</b><p class="mu">Muitas tentativas incorretas. Aguarde ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}.</p></div></div>`);setTimeout(tk,1000)};tk()}
function clickGuard(ev){if(!ev.isTrusted||CHK)return;if(ev.target&&ev.target.closest&&ev.target.closest('#cg'))return;const t=Date.now();
 if(t-LASTC<140){ev.stopImmediatePropagation();ev.preventDefault();return}LASTC=t;if(t<HUMAN)return;
 CL.push([t,ev.clientX,ev.clientY]);if(CL.length>22)CL.shift();if(CL.length<22)return;
 const iv=[];for(let i=1;i<CL.length;i++)iv.push(CL[i][0]-CL[i-1][0]);const mean=iv.reduce((a,b)=>a+b,0)/iv.length;if(mean>1800)return;
 const sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mean)*(b-mean),0)/iv.length),xs=CL.map(c=>c[1]),ys=CL.map(c=>c[2]);
 if(sd/mean<.12&&Math.max(...xs)-Math.min(...xs)<=10&&Math.max(...ys)-Math.min(...ys)<=10)challenge()}
if(document.addEventListener)document.addEventListener('click',clickGuard,true);
try{const lk=+localStorage.getItem('dd_lock');if(lk>Date.now())cgLock(lk);else if(localStorage.getItem('dd_chk'))challenge()}catch(e){}
