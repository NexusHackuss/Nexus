<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digimon Nexus</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#050505"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Digimon Nexus"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--bg:#10131c;--card:#1a1f2e;--tx:#e8ebf5;--mu:#8a92a8;--ac:#6f7788;--bd:#2c3347;--hp:#2f9e44;--r:12px;--r2:8px;--r3:6px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--ac:#5b6475;--bg:#f3f5fa;--card:#fff;--tx:#1a1f2e;--mu:#667;--bd:#d5d9e5}
:root[data-theme="cyber"]{--bg:#050505;--card:#0a0a0a;--tx:#f3dede;--mu:#b56a6a;--ac:#ff1f1f;--bd:#6b1010;--hp:#ff3b3b;--r:0px;--r2:0px;--r3:0px}
[data-theme="cyber"] body{font-family:ui-monospace,Consolas,monospace;background-image:repeating-linear-gradient(0deg,rgba(255,0,0,.035) 0 1px,transparent 1px 3px)}
[data-theme="cyber"] .c{border-color:#8f1414;box-shadow:0 0 10px rgba(255,31,31,.15),inset 0 0 0 1px #000}
[data-theme="cyber"] button{background:transparent;border-color:#8f1414;text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-family:inherit}
[data-theme="cyber"] button:hover:not(:disabled){box-shadow:0 0 8px rgba(255,31,31,.6);border-color:#ff1f1f}
[data-theme="cyber"] button.on,[data-theme="cyber"] button.p{background:#ff1f1f;color:#050505;border-color:#ff1f1f;font-weight:700}
[data-theme="cyber"] .tag{background:transparent;border:1px solid #6b1010;color:#ff6b6b;text-transform:uppercase;font-size:10px}
[data-theme="cyber"] .bar{height:4px;background:#2a0808}
[data-theme="cyber"] input,[data-theme="cyber"] select{border-color:#6b1010;font-family:inherit}
[data-theme="cyber"] b{letter-spacing:.03em}
.logo{display:block;max-width:100%;height:auto;max-height:84px;margin:0 auto}.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}.th{display:flex;gap:4px}.lgw{display:flex;align-items:flex-end;gap:6px;min-width:0}.ver{font-size:10px;line-height:1;color:var(--mu);opacity:.85;white-space:nowrap;padding-bottom:5px}.th button{padding:6px 8px;position:relative}.bdg{position:absolute;top:-5px;right:-5px;background:#e03131;color:#fff;font-size:10px;font-weight:700;line-height:1;border-radius:9px;padding:2px 5px;min-width:8px}
html,body{background:var(--bg)}body{color:var(--tx);font-family:system-ui,sans-serif;max-width:640px;margin:auto;padding:12px}
h1{font-size:20px;margin:4px 0}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;color:var(--mu);font-size:14px;min-height:52px;overflow:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);box-sizing:border-box}.ntx{width:100%;cursor:pointer;background:var(--card);border:1px solid var(--ac);border-radius:var(--r);padding:6px 10px;color:var(--tx);box-sizing:border-box;line-height:1.3;max-height:48px;overflow:auto}
nav{margin:10px 0}.nv{display:flex;gap:4px;overflow-x:auto;margin-bottom:4px}.nv button{flex:1;white-space:nowrap}.nv.sb button{font-size:13px;padding:6px 8px}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r2);padding:8px 10px;cursor:pointer;font-size:14px}
button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4}
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin:8px 0}
.big{font-size:52px;text-align:center}.bar{height:10px;background:var(--bd);border-radius:var(--r3);overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--ac)}.bar.h i{background:var(--hp)}.bar.d i{background:#1c7ed6}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}.mu{color:var(--mu);font-size:13px}
.tag{font-size:11px;background:var(--bd);border-radius:var(--r3);padding:2px 6px;white-space:nowrap}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:8px}.arena .c{text-align:center;margin:0}.arena .big{font-size:44px}
input,select{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;border:1px solid var(--bd);border-radius:var(--r2);background:var(--card);color:var(--tx)}
.nov{z-index:20}.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}.pop{max-width:420px;width:100%;max-height:85vh;overflow:auto}
.dxg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dxt{width:68px;text-align:center;border:1px solid var(--bd);border-radius:var(--r);padding:6px 2px;cursor:pointer;background:var(--card);font-size:11px;box-sizing:border-box}.dxe{display:block;font-size:34px;line-height:1.2}.dxn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}
.auw{position:relative;display:inline-block;line-height:1;isolation:isolate}.auimg{position:relative;z-index:1;display:inline-block}.aura{position:absolute;left:50%;top:50%;width:170%;height:170%;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;z-index:2;opacity:.9;animation:aup 2.6s ease-in-out infinite}.auhalo{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,225,120,.65),rgba(255,140,40,.3) 45%,transparent 70%);animation:auh 2.6s ease-in-out infinite;pointer-events:none;z-index:0}@keyframes aup{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}@keyframes auh{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.aura.aurad{left:50%;top:-113%;width:auto;height:240%;transform:translateX(-50%);image-rendering:pixelated;animation:none;opacity:1}
.hold{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lg{font-size:13px;line-height:1.5;height:170px;overflow-y:scroll;box-sizing:border-box}
.nt{height:56px;margin:6px 0;display:flex;align-items:center;padding:0 12px;border-radius:var(--r);font-size:14px;line-height:1.3;box-sizing:border-box;overflow:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;border:1px solid transparent}.nt.on{background:var(--card);border-color:var(--ac)}.nt.off{display:none}
</style></head><body>

 cgShow(`<div class="ov" style="z-index:99"><div class="c pop" style="text-align:center"><b>🤖 Você é humano?</b><p class="mu">Atividade muito repetitiva detectada. Toque no <b style="font-size:22px">${t}</b> para continuar.</p><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">${ord.map(x=>`<button style="font-size:30px;padding:10px 14px" onclick="cgPick('${x}')">${x}</button>`).join('')}</div></div></div>`)}
function cgPick(x){if(x===CHK){CHK=null;FAILS=0;CL.length=0;HUMAN=Date.now()+15*60000;try{localStorage.removeItem('dd_chk')}catch(e){}cgHide();return}FAILS++;if(FAILS>=3)cgLock(Date.now()+300000);else challenge()}
function cgLock(until){try{localStorage.setItem('dd_lock',String(until))}catch(e){}CHK=null;const tk=()=>{const left=until-Date.now();if(left<=0){FAILS=0;try{localStorage.removeItem('dd_lock');localStorage.removeItem('dd_chk')}catch(e){}cgHide();return}cgShow(`<div class="ov" style="z-index:99"><div class="c pop" style="text-align:center"><b>⏳ Pausa de segurança</b><p class="mu">Muitas tentativas incorretas. Aguarde ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}.</p></div></div>`);setTimeout(tk,1000)};tk()}

 if(t-LASTC<140){ev.stopImmediatePropagation();ev.preventDefault();return}LASTC=t;if(t<HUMAN)return;
 CL.push([t,ev.clientX,ev.clientY]);if(CL.length>22)CL.shift();if(CL.length<22)return;
 const iv=[];for(let i=1;i<CL.length;i++)iv.push(CL[i][0]-CL[i-1][0]);const mean=iv.reduce((a,b)=>a+b,0)/iv.length;if(mean>1800)return;

const BG_X=10,BG_NK=1.2,BG_POT=POT_MAX,BG_P0=.03,BG_PK=.012,BG_HP_TXT='999.999.999.999.999.999',BG_HP0=999999999999999999n,fmtD=n=>Number(n||0).toLocaleString('pt-BR'),bgOp=(a,sel)=>a.map(x=>`<option value="${x[0]}"${String(x[0])===String(sel)?' selected':''}>${x[1]}</option>`).join('');
function cdFmt(ms){let s=Math.max(0,Math.floor(ms/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;const p=n=>String(n).padStart(2,'0');return(d?d+'d ':'')+p(h)+'h '+p(m)+'min '+p(s)+'s'}
function bgHpTxt(){try{return(BG_HP0-BigInt(Math.floor((B&&B.bg&&B.bg.dmg)||0))).toLocaleString('pt-BR')}catch(e){return BG_HP_TXT}}
function bgOk(x){const q=BGS;if(!q||!q.digimon)return false;const d=D[x.id];if(!d)return false;if(q.req_ty&&d.a!==q.req_ty)return false;if(q.req_st&&d.st!==q.req_st)return false;if(q.req_el&&nel(d.e)!==q.req_el)return false;return true}
async function bgRetry(){try{const k='dd_bgp_'+UID,v=localStorage.getItem(k);if(!v)return;const p=JSON.parse(v),r=await SB.rpc('boss_submit',{p_run:p.run,p_damage:p.dmg});if(!r.error||/encerrada|expirada|inválida|fechou/i.test(r.error.message||''))localStorage.removeItem(k)}catch(e){}}
async function bgRank(){try{const wk=BGS&&BGS.week?BGS.week:(await SB.rpc('pvp_week')).data;const r=await SB.from('boss_rank_week').select('*').eq('week',wk).order('damage',{ascending:false}).limit(50);if(r.error)throw r.error;BGR=r.data||[]}catch(e){BGR=[]}}
async function bgLoad(){if(!isOn())return;try{await bgRetry();await SB.rpc('close_boss_weeks');const r=await SB.rpc('boss_status');if(r.error)throw r.error;BGS=r.data;BGS.dayEnd=Date.now()+r.data.secs_day*1000;BGS.weekEnd=Date.now()+r.data.secs_week*1000;FRAG=r.data.fragments||0;BGE='';BSEL=BSEL.filter(u=>{const x=allMons().find(z=>z.u===u);return x&&bgOk(x)})}catch(e){BGS=null;BGE=(e&&e.message)||String(e)}
 if(BGT==='r')await bgRank();if(U&&G)draw()}
function bgTab(t){BGT=t;if(t==='r')bgRank().then(()=>draw());else if(t==='s'){walletLoad().then(()=>draw());shCntLoad('frag')}else draw()}
function bgTog(u){const i=BSEL.indexOf(u);if(i>=0)BSEL.splice(i,1);else if(BSEL.length<3)BSEL.push(u);else G.log='Você pode levar no máximo 3 Digimon.';draw()}
function bgMove(){const g=B.bg;g.t++;const P=Math.min(1,BG_P0+BG_PK*(g.t-1)),d=D[B.en.id];return{n:d.sig||'Golpe Final',e:d.e,pct:P*100,c:0,p:0,b:0}}
function bgTurnEnd(){const p=B.pv;if(B.me.hp<=0){p.mi++;if(p.mi>=p.me.length){B.end=2;B.log.push(`💥 Sua equipe foi derrotada! Dano total no Boss: ${fmtD(B.bg.dmg)}`);bgFinish();return}B.me=mk(p.me[p.mi],pveMul());B.log.push(`➡️ Você envia ${D[B.me.id].nm}!`)}}
async function bgFinish(){const b=B.bg,dmg=Math.floor(b.dmg);try{localStorage.setItem('dd_bgp_'+UID,JSON.stringify({run:b.run,dmg}))}catch(e){}
 try{const r=await SB.rpc('boss_submit',{p_run:b.run,p_damage:dmg});if(r.error)throw r.error;const x=r.data;try{localStorage.removeItem('dd_bgp_'+UID)}catch(e){}B.log.push(`🌍 ${fmtD(x.damage)} de dano registrado! Total da semana: ${fmtD(x.total)} · posição ${x.rank}º`)}
 catch(e){const m=(e&&e.message)||'Falha ao enviar o dano.',fatal=/encerrada|expirada|inválida|fechou/i.test(m);if(fatal)try{localStorage.removeItem('dd_bgp_'+UID)}catch(e2){}B.log.push('⚠️ '+m+(fatal?'':' Vamos tentar de novo automaticamente.'))}
 draw();bgLoad()}
async function startBoss(){if(!BGS||!isOn()||(B&&!B.end))return;const sel=BSEL.map(u=>allMons().find(x=>x.u===u)).filter(x=>x&&D[x.id]&&bgOk(x));if(!sel.length){G.log='Escolha de 1 a 3 Digimon que cumpram a exigência.';return draw()}
 if(BGS.left<=0){G.log='Suas entradas de hoje acabaram. Elas recarregam às 00:00 (Brasília).';return draw()}
 const r=await SB.rpc('boss_begin');if(r.error){G.log='⚠️ '+r.error.message;return draw()}const x=r.data,d=D[x.digimon];if(!d){G.log='O Digimon do boss não está disponível neste aparelho. Atualize a página.';return draw()}
 const base=(CAP0+CAPK*BG_POT)*BG_X,en=mk({id:x.digimon,F:base,D:base,V:base,I:base,lv:100,rb:BOSS_REB,pot:BG_POT,abi:100});en.boss=1;en.pot=BG_POT;en.hp=1e15;
 B={k:-2,bg:{run:x.run,dmg:0,t:0},pv:{me:sel,mi:0,login:d.nm,en:[null],ei:0},me:mk(sel[0],pveMul()),en,end:0,log:[`🌍 O Boss Global ${d.nm} apareceu! Cause o máximo de dano antes da sua equipe cair. O ataque dele cresce a cada turno.`]};BGS.left=x.left;tab='bt';draw()}
function bgBossHTML(){const q=BGS;if(!q.digimon)return'<div class="c"><b>🌍 Boss Global</b><p class="mu">Nenhum boss foi definido para esta semana. Volte em breve!</p></div>';
 const d=D[q.digimon];if(!d)return'<div class="c"><p class="mu">O Digimon do boss ainda não está disponível neste aparelho. Atualize a página.</p></div>';
 const reqs=[q.req_ty?`Tipo: <b>${AN[q.req_ty]||q.req_ty}</b>`:'',q.req_st?`Forma: <b>${SG[q.req_st]}</b>`:'',q.req_el?`Elemento: <b>${(EI[q.req_el]||'')+' '+q.req_el}</b>`:''].filter(Boolean),elig=allMons().filter(x=>D[x.id]&&bgOk(x));
 return`<div class="c" style="text-align:center"><div class="big">${d.em}</div><b>${d.nm}</b> <span class="tag">🌍 BOSS GLOBAL</span><div>${tags(d)}</div><div class="mu">Nv 100 · ABI 100 · Potencial ${BG_POT} · atributos ×${BG_X} · ${SG[d.st]}</div><div class="mu">HP ${BG_HP_TXT} / ${BG_HP_TXT}</div>${bar(1,1,'h')}<p class="mu">O HP do boss é praticamente infinito: o que vale é o <b>dano total</b> da semana. O ataque dele cresce a cada turno.</p></div>
<div class="c"><div class="row"><span>⏳ Boss troca em</span><b id="bg_cd_wk">${cdFmt(q.weekEnd-Date.now())}</b></div><div class="row"><span>🎟️ Entradas hoje</span><b>${q.left}/${q.limit}${q.vip?' ⭐ VIP':''}</b></div><div class="row"><span>🔄 Entradas recarregam em</span><b id="bg_cd_day">${cdFmt(q.dayEnd-Date.now())}</b></div><div class="row"><span>💥 Seu dano na semana</span><b>${fmtD(q.my_damage)}${q.my_rank?' · '+q.my_rank+'º':''}</b></div><div class="row"><span>🧩 Fragmentos Digitais</span><b>${FRAG}</b></div></div>
<div class="c"><b>Exigência para enfrentar</b><p>${reqs.length?reqs.join(' · '):'<span class="mu">Nenhuma: qualquer Digimon pode entrar.</span>'}</p>`+(elig.length?`<p class="mu">Escolha até 3 Digimon (${BSEL.length}/3). Vale o que cada um treinou${vipOn()?'. ⭐ Seu bônus VIP vale aqui: status ×2 nos seus Digimon.':', sem bônus (o VIP dobra os status contra o boss).'}</p>`+elig.map(x=>`<div class="row"><span>${D[x.id].em} <b>${D[x.id].nm}</b> Nv ${x.lv||1} <span class="mu">Poder ${pw(x)}</span></span><button class="${BSEL.includes(x.u)?'on':''}" onclick="bgTog('${x.u}')">${BSEL.includes(x.u)?'✓ Escolhido':'Escolher'}</button></div>`).join(''):'<p class="mu">Você não tem nenhum Digimon que cumpra a exigência desta semana.</p>')+`<button class="p" ${BSEL.length&&q.left>0?'':'disabled'} onclick="startBoss()">⚔️ Enfrentar o Boss${q.left>0?'':' (sem entradas)'}</button></div>`}
function bgRankHTML(){const q=BGS,med=['🥇','🥈','🥉'];return`<div class="c"><div class="row"><span>⏳ A semana fecha em</span><b id="bg_cd_wk">${cdFmt(q.weekEnd-Date.now())}</b></div><p class="mu">Vale a soma do dano de todas as suas lutas na semana. Ao fechar (segunda 00:00, Brasília): 🧩 1º lugar 10 · 2º 5 · 3º 3 · demais 1 Fragmento Digital.</p></div><div class="c">`+(BGR.length?BGR.map((x,i)=>{const me=x.user_id===UID;return`<div class="row" style="${me?'font-weight:700;border-left:3px solid var(--ac);padding-left:6px':''}"><span>${med[i]||(i+1)+'º'} <b>${esc(x.login)}</b></span><b>${fmtD(x.damage)}</b></div>`}).join(''):'<p class="mu">Ninguém causou dano ainda nesta semana.</p>')+(q.my_rank&&!BGR.some(x=>x.user_id===UID)?`<div class="row" style="font-weight:700"><span>${q.my_rank}º <b>Você</b></span><b>${fmtD(q.my_damage)}</b></div>`:'')+'</div>'}
async function buy4(k){const it=SHOP4[k];if(!it||!isOn())return;if(limLeft('frag',it)<=0){G.log='Limite de compras deste item atingido.';return draw()}if(FRAG<Math.max(1,it.p|0)){G.log='Fragmentos Digitais insuficientes.';return draw()}
 if(it.fx==='egg'&&G.box.length>=boxCap()&&G.team.length>=TM){G.log='Box cheia.';return draw()}
 const r=await SB.rpc('frag_buy',{p_idx:k});if(r.error){G.log='⚠️ '+r.error.message;return draw()}FRAG=r.data;grantFx(it);limAdd('frag',it);eggBuyMsg(it);save();draw();shCntLoad('frag')}
function fragShopHTML(){return`<div class="c"><b>🧩 Loja de Fragmentos</b><div class="row"><span>Seu saldo</span><b>🧩 ${FRAG}</b></div><p class="mu">Fragmentos Digitais são pagos no fim da semana do Boss Global: 1º lugar 10 · 2º 5 · 3º 3 · demais participantes 1.</p>`+(SHOP4.length?SHOP4.map((i,k)=>`<div class="row"><span>${i.fx==='eggx'&&i.eg?eIc(i.eg)+' ':''}${DGI_BY[i.fx]?itIc(i.fx)+' ':''}${i.n}<br><span class="mu" style="font-size:11px">${itemDesc(i)}</span>${limTxt('frag',i)}</span><button ${FRAG<i.p||limLeft('frag',i)<=0?'disabled':''} onclick="buy4(${k})">🧩 ${i.p}</button></div>`).join(''):'<p class="mu">A loja ainda não tem itens. Volte em breve!</p>')+'</div>'}

/* ===== v12 (Patch 1): Treinador — nível pela Dex (sem teto) + 5 atributos ===== */
const TR={c:10,ppl:2,att:[
 ['v','💞','Vínculo','+0,5% nos status dos seus Digimon por ponto, sem limite (arena, História, Infernal e Boss)',.005],
 ['s','🍀','Sorte','+1% de moedas ganhas nas lutas por ponto, sem limite',.01],
 ['e','🎯','Estratégia','+1% de dano crítico por ponto, sem limite (o crítico normal causa +50%, então 100 pontos levam o crítico a +150%). Não muda a chance de acertar um crítico',.01],
 ['r','🛡️','Resolução','-0,4% de dano recebido por ponto. Retorno decrescente: cada ponto ajuda, mas nunca chega à imunidade (arena, História, Infernal e Boss)',.004]]};
const dexPts=d=>d.cm?1:Math.max(1,1+Math.round(pcOf(d)/5)),
 trXpTot=()=>{if(!G)return 0;let p=0;for(const k in G.seen)if(G.seen[k]&&D[k])p+=dexPts(D[k]);return p},
 trLvAt=P=>Math.floor((Math.sqrt(1+8*P/TR.c)-1)/2),trCum=l=>TR.c*l*(l+1)/2,
 tLv=()=>trLvAt(trXpTot()),
 trTa=()=>{const a={v:0,s:0,e:0,r:0},g=(G&&G.ta)||{};for(const k in a)a[k]=Math.max(0,Math.floor(+g[k])||0);return a},
 trSpent=()=>{const a=trTa();return a.v+a.s+a.e+a.r},
 trFree=()=>Math.max(0,tLv()*TR.ppl-trSpent()),
 trV=()=>trTa().v*.005,trCoin=()=>1+trTa().s*.01,trCritDmg=()=>trTa().e*.01,critMul=a=>1.5+(a===B.me&&trPve()?trCritDmg():0),trRes=()=>{const x=trTa().r*.004;return x/(1+x)},trBonus=(k,p)=>k==='v'?p*.005:k==='s'?p*.01:k==='e'?p*.01:(p*.004)/(1+p*.004),
 trPve=()=>!B.pv||!!B.bg,pveMul=()=>vipMul()*(1+trV());
function trAdd(k,n){const a=trTa(),room=Math.min(n,trFree());if(room<=0)return;a[k]+=room;G.ta=a;save();draw()}
function trReset(){if(!trSpent()){G.log='Você ainda não distribuiu nenhum ponto.';return draw()}if(!(G.inv.trreset>0)){G.log='Você precisa de um 🔄 Pergaminho de Redistribuição (loja de gemas).';return draw()}G.inv.trreset--;G.ta={v:0,s:0,e:0,r:0};G.log='🔄 Pergaminho usado! Pontos redistribuídos: escolha de novo.';save();draw()}
function trCheck(){if(!G)return;const l=tLv();
 if(G.ta&&trSpent()>l*TR.ppl){G.ta={v:0,s:0,e:0,r:0};NQ.push('🎓 Seus pontos de treinador foram redistribuídos (total acima do permitido pelo nível). Escolha de novo no Perfil › Treinador.')}
 if(G.tls===undefined){G.tls=l;if(l>=1)NQ.push(`<b style="font-size:18px">🎓 Sistema de Treinador!</b><p>Seu nível agora vem da <b>Dex</b>: você é <b>Treinador Nv ${l}</b> e tem <b>${trFree()}</b> ponto(s) para distribuir.</p><p class="mu">Perfil › Treinador: Vínculo, Sorte, Estratégia e Resolução.</p>`);save();return}
 if(l>G.tls){const g=(l-G.tls)*TR.ppl;G.tls=l;NQ.push(`🎓 <b>Treinador Nv ${l}!</b><br>+${g} ponto(s) de atributo · disponível: <b>${trFree()}</b>`);save()}}
function trHTML(){const l=tLv(),a=trTa(),P=trXpTot(),lo=trCum(l),hi=trCum(l+1),free=trFree(),seen=Object.keys(G.seen).filter(k=>G.seen[k]&&D[k]).length,tot=Object.keys(D).length;
 const fv=[['In Training',{st:1}],['Baby',{st:2}],['Rookie',{st:3}],['Champion',{st:4}],['Ultimate',{st:5}],['Armor',{st:3,ty:'armor'}],['Mega',{st:6}],['Side-Mega',{st:6,ty:'side'}],['Burst',{st:8}],['Jogress',{st:7}],['Jogress+',{st:10}],['Awaken',{st:9}],['Care Mistake',{cm:1}]].map(x=>x[0]+' '+dexPts(x[1])).join(' · ');
 return`<div class="c"><div class="row"><b style="font-size:17px">🎓 Treinador</b><b>Nv ${l}</b></div><div class="mu">Pontos da Dex: ${fmtD(P)} · faltam ${fmtD(hi-P)} para o Nv ${l+1}</div>${bar(P-lo,hi-lo,'d')}
<p class="mu">Seu nível vem da <b>Dex</b>: cada Digimon registrado vale pontos, e quanto mais avançada a forma, mais pontos. Não há nível máximo: conforme novos Digimon entram no jogo, o nível continua crescendo. Cada nível dá ${TR.ppl} pontos e os atributos não têm limite de pontos. Os bônus valem na arena, História, Infernal e Boss Global. <b>No PvP não valem.</b></p>
<div class="mu" style="font-size:11px">Digimon registrados: ${seen}/${tot}<br>Pontos por forma: ${fv}</div>
<div class="row"><span>Pontos disponíveis</span><b style="font-size:18px">${free}</b></div><div class="row"><span class="mu">Gastos</span><span class="mu">${trSpent()} / ${l*TR.ppl}</span></div></div>`+
 TR.att.map(x=>{const p=a[x[0]];return`<div class="c"><div class="row"><span style="font-size:16px">${x[1]} <b>${x[2]}</b></span><b>${fmtD(p)} pts</b></div><div class="mu" style="font-size:12px">${x[3]}</div><div class="row"><span class="mu">Bônus atual: <b>${p?(x[0]==='r'?'−':'+')+(Math.round(trBonus(x[0],p)*1000)/10).toString().replace('.',',')+'%':'—'}</b>${x[0]==='e'?` · dano crítico total <b>${150+p}%</b>`:''}</span><span><button ${free>0?'':'disabled'} onclick="trAdd('${x[0]}',1)">+1</button> <button ${free>0?'':'disabled'} onclick="trAdd('${x[0]}',5)">+5</button> <button ${free>0?'':'disabled'} onclick="trAdd('${x[0]}',10)">+10</button> <button ${free>0?'':'disabled'} onclick="trAdd('${x[0]}',1e9)">Tudo</button></span></div></div>`}).join('')+
 `<div class="c"><button ${trSpent()&&G.inv.trreset>0?'':'disabled'} onclick="trReset()">🔄 Redistribuir pontos (usa 1 Pergaminho)</button><div class="mu" style="margin-top:4px">Você tem <b>${G.inv.trreset||0}</b> 🔄 Pergaminho(s) de Redistribuição.${G.inv.trreset>0?'':' Compre na <b>Loja de gemas</b>.'}</div></div>`}

/* ===== v7: segurar o botão para treinar mais rápido (não usa cliques, então não aciona o freio de auto clicker) ===== */
let HOLD=null;
function trainStep(s){const m=M(),c=statCap(m);if(m[s]>=c)return'cap';if(G.free+G.extra<=0)return'pts';let g;if(G.free>0){G.free--;g=5}else{G.extra--;g=1}if(s===D[m.id].sp)g=Math.ceil(g*1.5);g=Math.min(g,c-m[s]);m[s]+=g;m.tt=(m.tt||0)+1;m.tp=m.tp||{F:0,D:0,V:0,I:0};m.tp[s]=(m.tp[s]||0)+1;gx(m,2);return g}
function holdUI(){const m=M(),s=HOLD.s,e=document.getElementById('tv_'+s),p=document.getElementById('tp_'+s),i=document.getElementById('hold_info');if(e)e.textContent=m[s];if(p)p.textContent='· '+((m.tp||{})[s]||0)+' pts gastos';if(i)i.textContent=`Treinando ${SN[s]}: +${HOLD.tot} (${HOLD.n}x) · pontos restantes: ${G.free+G.extra}`}
function holdTick(){if(!HOLD)return;let end='';for(let i=0;i<HOLD.k;i++){const r=trainStep(HOLD.s);if(typeof r==='string'){end=r;break}HOLD.n++;HOLD.tot+=r}if(end){holdStop(end);return}holdUI()}
function holdStart(s,ev,k){if(HOLD||tab!=='tr'||(ev&&ev.button>0))return;if(ev&&ev.preventDefault)ev.preventDefault();HOLD={s,k:k||1,n:0,tot:0,t:0,iv:0};holdTick();if(!HOLD)return;
 HOLD.t=setTimeout(()=>{const loop=()=>{if(!HOLD)return;holdTick();if(HOLD)HOLD.iv=setTimeout(loop,HOLD.n>25?55:110)};loop()},380);
 if(document.addEventListener){['pointerup','pointercancel','mouseup','touchend','touchcancel','blur'].forEach(n=>(n==='blur'?window:document).addEventListener&&(n==='blur'?window:document).addEventListener(n,holdStop))}}
function holdStop(why){if(!HOLD)return;const h=HOLD;HOLD=null;clearTimeout(h.t);clearTimeout(h.iv);
 if(document.removeEventListener){['pointerup','pointercancel','mouseup','touchend','touchcancel','blur'].forEach(n=>(n==='blur'?window:document).removeEventListener&&(n==='blur'?window:document).removeEventListener(n,holdStop))}
 const w=typeof why==='string'?why:'';const m=M();
 if(h.n===0)G.log=w==='cap'?`⚠️ ${SN[h.s]} está no limite (${statCap(m)}). ${(m.pot||0)>=POT_MAX?'O potencial já está no máximo ('+POT_MAX+').':'Faça Reborn para aumentar o potencial.'}`:'Sem pontos! Volte mais tarde ou compre um Pacote de Treino.';
 else G.log=`+${h.tot} ${SN[h.s]} (${h.n} treino${h.n>1?'s':''}) e +${2*h.n} XP${w==='cap'?' · limite de status atingido':w==='pts'?' · acabaram os pontos':''}`;
 save();draw()}
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.hidden)holdStop()});


/* ===== v8: Cristais de Potencial e de ABI (loja de gemas) e treino no limite ===== */
const ABI_CRYSTAL=25;
function usePot(){const m=M();if(!(G.inv.potcrystal>0))return;if((m.pot||0)>=POT_MAX){G.log=`⚠️ ${D[m.id].nm} já está no potencial máximo (${POT_MAX}). O Cristal não foi gasto.`;return draw()}G.inv.potcrystal--;m.pot=(m.pot||0)+1;m.pcr=(m.pcr||0)+1;G.log=`🔮 Cristal de Potencial usado em ${D[m.id].nm}: Potencial ${m.pot} (limite de ${statCap(m)} por atributo).`;save();draw()}
function useAbi(){const m=M();if(!(G.inv.abicrystal>0))return;if((m.abi||0)>=ABI_MAX){G.log=`⚠️ ${D[m.id].nm} já está com a ABI no máximo (${ABI_MAX}). O cristal não foi gasto.`;return draw()}G.inv.abicrystal--;m.abi=Math.min(ABI_MAX,(m.abi||0)+ABI_CRYSTAL);m.acr=(m.acr||0)+1;G.log=`🧿 Cristal de ABI usado em ${D[m.id].nm}: +${ABI_CRYSTAL} ABI (agora ${m.abi}).`;save();draw()}
function trainStep(s){const m=M(),c=statCap(m);if(G.free+G.extra<=0)return'pts';let g;if(G.free>0){G.free--;g=5}else{G.extra--;g=1}if(s===D[m.id].sp)g=Math.ceil(g*1.5);g=Math.max(0,Math.min(g,c-m[s]));m[s]+=g;m.tt=(m.tt||0)+1;m.tp=m.tp||{F:0,D:0,V:0,I:0};m.tp[s]=(m.tp[s]||0)+1;gx(m,2);return g}
function trainN(s,n){tick();const m=M(),c=statCap(m);if(G.free+G.extra<=0){G.log='Sem pontos! Volte mais tarde ou compre um Pacote de Treino.';return draw()}
 let done=0,tot=0;for(let i=0;i<n;i++){const r=trainStep(s);if(typeof r==='string')break;done++;tot+=r}
 const end=done<n?' · acabaram os pontos':'';
 G.log=tot>0?`+${tot} ${SN[s]} (${done} treino${done>1?'s':''}) e +${2*done} XP${m[s]>=c?` · limite de status (${c}) atingido: os próximos pontos só contam para as evoluções`:''}${end}`:`${SN[s]} está no limite (${c}): ${done} ponto${done>1?'s':''} de treino contado${done>1?'s':''} para as evoluções (o status não sobe) e +${2*done} XP${end}`;save();draw()}
function train(s){trainN(s,1)}
function holdStop(why){if(!HOLD)return;const h=HOLD;HOLD=null;clearTimeout(h.t);clearTimeout(h.iv);
 if(document.removeEventListener){['pointerup','pointercancel','mouseup','touchend','touchcancel','blur'].forEach(n=>(n==='blur'?window:document).removeEventListener&&(n==='blur'?window:document).removeEventListener(n,holdStop))}
 const w=typeof why==='string'?why:'',m=M();
 if(h.n===0)G.log='Sem pontos! Volte mais tarde ou compre um Pacote de Treino.';
 else G.log=h.tot>0?`+${h.tot} ${SN[h.s]} (${h.n} treino${h.n>1?'s':''}) e +${2*h.n} XP${m[h.s]>=statCap(m)?' · limite de status atingido: os pontos seguintes só contam para as evoluções':''}${w==='pts'?' · acabaram os pontos':''}`:`${SN[h.s]} está no limite (${statCap(m)}): ${h.n} ponto${h.n>1?'s':''} de treino contado${h.n>1?'s':''} para as evoluções (o status não sobe) e +${2*h.n} XP${w==='pts'?' · acabaram os pontos':''}`;
 save();draw()}
